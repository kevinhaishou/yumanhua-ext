name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor extension stubs (extensions-lib 1.4.2)
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-lib
          ref: 1.4.2
          path: vendor/extlib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean
        shell: bash
        run: |
          set -o pipefail
          gradle clean --no-daemon --no-build-cache 2>&1 | tee build.log

      - name: Build release
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --no-build-cache --rerun-tasks --stacktrace 2>&1 | tee -a build.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yumanhua-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish apk and log back to repo
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp build.log out/build.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "ci: artifacts [skip ci]" || true
          git push || true
