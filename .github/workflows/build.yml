name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME" 2>/dev/null | head

      - name: Build release
        run: gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yumanhua-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish apk and log back to repo
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp build.log out/build.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A out
          git commit -m "ci: artifacts [skip ci]" || true
          git push || true
